# Linux x86_64. Install Python packages separately, in the order documented in
# docs/training_environment.md (torch must precede DeepSpeed / causal-conv1d).
name: search-comp-qwen35-cu126
channels:
  - nvidia/label/cuda-12.6.3
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - cuda-toolkit=12.6
  - gcc_linux-64=12
  - gxx_linux-64=12
  - ninja
  - cmake
  - git

