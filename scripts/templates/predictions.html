<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轨迹检查报告</title>
<style>
:root{color-scheme:light;--bg:#f3f5f8;--border:#dae1eb;--muted:#64748b;--ink:#17243a;--accent:#245fc1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,sans-serif}header{padding:24px 28px 18px;background:#fff;border-bottom:1px solid var(--border)}h1{font-size:22px;margin:0;overflow-wrap:anywhere}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}.muted{color:var(--muted);overflow-wrap:anywhere}.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}.stat{background:var(--bg);padding:9px 16px;border-radius:8px}.stat strong{font-size:19px;margin-right:7px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:16px 28px}input,select,button{font:inherit;border:1px solid var(--border);border-radius:6px;padding:7px 10px;background:white;color:var(--ink)}input{flex:1;min-width:200px}button{cursor:pointer}button:hover{border-color:var(--accent)}main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;padding:0 28px 28px}aside{max-height:calc(100vh - 260px);overflow:auto;position:sticky;top:12px;align-self:start}.item{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px;white-space:normal}.item.active{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:5px}.card{background:white;border:1px solid var(--border);border-radius:9px;padding:18px;margin-bottom:14px;min-width:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tag{display:inline-block;border-radius:4px;background:#edf1f7;padding:1px 7px;font-size:12px;margin-right:5px;overflow-wrap:anywhere}.good{background:#dff5e9;color:#17683b}.bad{background:#ffe7e7;color:#a92f2f}pre,.content{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;margin:0}details{border:1px solid var(--border);border-radius:7px;margin:10px 0;background:#fff}summary{cursor:pointer;padding:10px 13px;font-weight:600;overflow-wrap:anywhere}details>.body{padding:0 13px 13px}.message{border-left:4px solid #98a7ba}.message.assistant{border-left-color:#5689df}.message.tool{border-left-color:#d2a148}.message.system{border-left-color:#af91bf}.segment{margin:8px 0;padding:12px;border-radius:6px;background:#f6f8fb}.segment.think{background:#f3effa}.segment.call{background:#fff5df}.segment.answer{background:#eaf6ee}.section-label{font-size:12px;color:var(--muted);margin-bottom:5px}.metrics{display:flex;flex-wrap:wrap;gap:9px}.metric{padding:5px 9px;background:var(--bg);border-radius:5px}.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:850px){main{grid-template-columns:1fr;padding:0 12px 12px}aside{position:static;max-height:240px}.pair{grid-template-columns:1fr}header,.toolbar{padding:16px}}
</style>
</head>
<body>
<header><h1 id="title"></h1><div id="source" class="muted"></div><div id="stats" class="stats"></div></header>
<div class="toolbar"><input id="query" type="search" aria-label="全文搜索" placeholder="搜索问题、答案、ID、轨迹或其他字段…"><select id="status" aria-label="状态"><option value="">全部状态</option></select><select id="em" aria-label="EM 筛选"><option value="">全部 EM</option><option value="true">EM 正确</option><option value="false">EM 错误</option><option value="missing">EM 缺失</option></select><select id="sort" aria-label="排序"><option value="original">原始顺序</option><option value="f1">F1 从低到高</option><option value="seconds">耗时从高到低</option><option value="generated_tokens">Token 从高到低</option></select></div>
<main><aside><div id="count" class="muted"></div><div id="list"></div></aside><article id="detail"></article></main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const report=JSON.parse(document.getElementById('report-data').textContent);
const rows=report.rows, $=id=>document.getElementById(id);
const text=v=>v==null?'—':typeof v==='string'?v:JSON.stringify(v,null,2);
const el=(tag,cls,value)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n};
const present=v=>v!==undefined&&v!==null;
const number=v=>present(v)&&v!==''&&typeof v!=='boolean'&&Number.isFinite(Number(v))?Number(v):null;
const emValue=r=>r.exact_match===true||r.exact_match===1||r.exact_match==='true'? 'true':r.exact_match===false||r.exact_match===0||r.exact_match==='false'?'false':'missing';
const messages=r=>Array.isArray(r.messages)?r.messages:[];
const question=r=>text(r.question??r.query??messages(r).find(m=>m.role==='user')?.content??'（未找到问题）');
const prediction=r=>r.prediction??r.predicted_answer??r.response;
const reference=r=>r.answer??r.answers??r.reference_answer??r.ground_truth;
const searchText=rows.map(r=>JSON.stringify(r).toLocaleLowerCase());
let visible=[],selected=null;
document.title=report.title;$('title').textContent=report.title;$('source').textContent=`来源：${report.source} · 离线报告 · 指标沿用原文件，不重新评分`;
const statusValues=[...new Set(rows.map(r=>String(r.status??'（缺失）')))];
for(const s of statusValues){const o=el('option','',s);o.value=s;$('status').append(o)}
function stat(label,value){const n=el('div','stat');n.append(el('strong','',value),document.createTextNode(label));$('stats').append(n)}
function mean(field,ids){const values=ids.map(i=>number(rows[i][field])).filter(v=>v!==null);return values.length?values.reduce((a,b)=>a+b,0)/values.length:null}
function updateStats(){ $('stats').replaceChildren();stat('当前 / 总条数',`${visible.length} / ${rows.length}`);const scored=visible.filter(i=>emValue(rows[i])!=='missing');stat(`EM（${scored.length} 条）`,scored.length?`${(100*scored.filter(i=>emValue(rows[i])==='true').length/scored.length).toFixed(1)}%`:'—');for(const [field,label,scale,suffix] of [['f1','平均 F1',100,'%'],['seconds','平均耗时',1,' s'],['generated_tokens','平均生成 Token',1,'']]){const value=mean(field,visible);stat(label,value===null?'—':(value*scale).toFixed(2)+suffix)}}
function card(title,value){const n=el('section','card');n.append(el('h2','',title),el('div','content',text(value)));return n}
function disclosure(title,body,open=false,cls=''){const d=el('details',cls);d.open=open;d.append(el('summary','',title));const b=el('div','body');b.append(body);d.append(b);return d}
function segment(parent,label,value,kind=''){const n=el('div',`segment ${kind}`);n.append(el('div','section-label',label),el('pre','',text(value)));parent.append(n)}
function contentBlocks(parent,value){
 if(typeof value!=='string'){segment(parent,'内容',value);return}
 // Only known protocol tags are interpreted; all content is rendered as text.
 const pattern=/<(think|thinking|tool_call|tool_calls_begin|search|visit|tool_response|information|answer)>([\s\S]*?)(?:<\/\1>|<\/tool_calls_end>)/g;
 let end=0,match;
 while((match=pattern.exec(value))!==null){if(match.index>end&&value.slice(end,match.index).trim())segment(parent,'内容',value.slice(end,match.index));const tag=match[1];const kind=['think','thinking'].includes(tag)?'think':tag==='answer'?'answer':['tool_response','information'].includes(tag)?'':'call';const label={think:'思考',thinking:'思考',answer:'最终答案',tool_response:'工具返回',information:'检索信息',tool_call:'工具调用',tool_calls_begin:'工具调用',search:'搜索',visit:'访问网页'}[tag];segment(parent,label,match[2],kind);end=pattern.lastIndex}
 if(value.slice(end).trim()||end===0)segment(parent,'内容',value.slice(end));
}
function show(index){
 selected=index;for(const b of $('list').children)b.classList.toggle('active',Number(b.dataset.index)===index);
 const r=rows[index],root=$('detail');root.replaceChildren();const pos=visible.indexOf(index);
 const nav=el('div','nav');for(const [label,offset] of [['← 上一条',-1],['下一条 →',1]]){const b=el('button','',label);b.disabled=pos+offset<0||pos+offset>=visible.length;b.onclick=()=>show(visible[pos+offset]);nav.append(b)}nav.append(el('span','muted',`${pos+1} / ${visible.length}`));root.append(nav);
 const meta=el('section','card');meta.append(el('h2','',text(r.id??`记录 ${index+1}`)));const metrics=el('div','metrics');for(const [key,label] of [['sample_index','样本索引'],['status','状态'],['exact_match','EM'],['f1','F1'],['seconds','耗时 (s)'],['generated_tokens','生成 Token'],['turns','工具轮数']])metrics.append(el('span','metric',`${label}: ${text(r[key])}`));meta.append(metrics);root.append(meta,card('问题',question(r)));
 const pair=el('div','pair');pair.append(card('参考答案',reference(r)),card('模型答案',prediction(r)));root.append(pair);
 const trajectory=el('section','card');trajectory.append(el('h2','',`对话轨迹 · ${messages(r).length} 条消息`));
 if(!messages(r).length)trajectory.append(el('p','muted','没有 messages 字段；请查看工具事件或原始记录。'));
 messages(r).forEach((m,i)=>{if(!m||typeof m!=='object'){trajectory.append(disclosure(`#${i+1} 消息`,el('pre','',text(m))));return}const body=el('div');if(present(m.reasoning_content??m.reasoning))segment(body,'思考',m.reasoning_content??m.reasoning,'think');if(present(m.content))contentBlocks(body,m.content);if(present(m.tool_calls))segment(body,'结构化工具调用',m.tool_calls,'call');const extra=Object.fromEntries(Object.entries(m).filter(([k])=>!['role','content','reasoning_content','reasoning','tool_calls'].includes(k)));if(Object.keys(extra).length)body.append(disclosure('消息元数据',el('pre','',text(extra))));const role=String(m.role??'unknown');const isTool=role==='tool'||(role==='user'&&typeof m.content==='string'&&/^\s*<(tool_response|information)>/.test(m.content));trajectory.append(disclosure(`#${i+1} · ${isTool?'工具返回':role}${m.name?' · '+m.name:''}`,body,role!=='system',`message ${isTool?'tool':role}`))});root.append(trajectory);
 root.append(disclosure(`工具事件 / events · ${Array.isArray(r.events)?r.events.length:'—'}`,el('pre','',text(r.events)),false));root.append(disclosure('完整原始记录（保留全部字段）',el('pre','',text(r)),false));
 const controls=el('div','nav');for(const [label,open] of [['展开全部轨迹',true],['折叠全部轨迹',false]]){const b=el('button','',label);b.onclick=()=>trajectory.querySelectorAll('details').forEach(d=>d.open=open);controls.append(b)}trajectory.insertBefore(controls,trajectory.children[1]??null);
}
function refresh(){
 const q=$('query').value.toLocaleLowerCase(),status=$('status').value,em=$('em').value,sort=$('sort').value;
 visible=rows.map((_,i)=>i).filter(i=>(!q||searchText[i].includes(q))&&(!status||String(rows[i].status??'（缺失）')===status)&&(!em||emValue(rows[i])===em));
 if(sort!=='original')visible.sort((a,b)=>{const x=number(rows[a][sort]),y=number(rows[b][sort]);return x===null?(y===null?a-b:1):y===null?-1:(sort==='f1'?x-y:y-x)||a-b});
 updateStats();$('count').textContent=`匹配 ${visible.length} 条`;$('list').replaceChildren();for(const i of visible){const r=rows[i],b=el('button','item');b.dataset.index=i;b.append(el('span','muted',`#${i+1} · ${text(r.id??'')}`));const tags=el('div');tags.append(el('span',`tag ${emValue(r)==='true'?'good':emValue(r)==='false'?'bad':''}`,`EM ${text(r.exact_match)}`),el('span','tag',`F1 ${number(r.f1)===null?'—':Number(r.f1).toFixed(3)}`),el('span','tag',text(r.status)));b.append(tags,el('div','preview',question(r)));b.onclick=()=>show(i);$('list').append(b)}if(visible.length)show(visible.includes(selected)?selected:visible[0]);else $('detail').replaceChildren(el('div','empty','没有匹配的记录。'));
}
let timer;$('query').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(refresh,180)});for(const id of ['status','em','sort'])$(id).addEventListener('change',refresh);refresh();
</script>
</body>
</html>
